name: Deploy to AWS ECS

on:
    push:
        branches: [main]

jobs:
    deploy:
        runs-on: ubuntu-latest
        if: false # Temporarily disable this workflow
        env:
            AWS_REGION: us-east-1
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v2
              with:
                  terraform_version: 1.6.6

            - name: Install additional dependencies
              run: |
                  # Install jq for JSON parsing and curl for health checks
                  sudo apt-get update && sudo apt-get install -y jq curl

            - name: Build and push Docker image
              run: |
                  # Use the refactored build-and-push script with auto-approve for CI
                  chmod +x infra/scripts/deployment/build-and-push.sh
                  ./infra/scripts/deployment/build-and-push.sh --auto-approve

            - name: Deploy to ECS
              run: |
                  # Deploy the new image to ECS
                  chmod +x infra/scripts/deployment/deploy-ecs.sh
                  ./infra/scripts/deployment/deploy-ecs.sh
